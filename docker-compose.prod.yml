services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: caegs-shop-api:local
    container_name: caegs-shop-api
    restart: unless-stopped
    mem_limit: 256m
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      BACKEND_HOST: 0.0.0.0
      PORT: 3333
      UPLOADS_DIR: /app/uploads
      TRUST_PROXY: "true"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app
      - db
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: "/api"
    image: caegs-shop-web:local
    container_name: caegs-shop-web
    restart: unless-stopped
    mem_limit: 96m
    ports:
      - "10.0.2.10:8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  uploads_data:

networks:
  app:
    name: caegs-shop
  db:
    external: true
