services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ca_platform
      POSTGRES_USER: ca
      POSTGRES_PASSWORD: ca
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ca -d ca_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ca:ca@postgres:5432/ca_platform?schema=public
      BACKEND_HOST: 0.0.0.0
    ports:
      - "3333:3333"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:3333
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
